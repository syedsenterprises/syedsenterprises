<style>
:root{
  --navy-950:#050b18;
  --navy-900:#081226;
  --navy-850:#0b1830;
  --navy-800:#0e1d3a;
  --navy-700:#16305c;
  --line:rgba(201,162,39,.28);
  --line-soft:rgba(148,170,210,.16);
  --gold:#c9a227;
  --gold-2:#e6c766;
  --gold-deep:#8f7214;
  --ink:#eef2fa;
  --body:#c3cee2;
  --muted:#8fa1c0;
  --card:#0a1730;
  --card-2:#0d1c3a;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Libre Franklin","Segoe UI",system-ui,-apple-system,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--navy-950);color:var(--body);
  font-family:var(--sans);font-size:16.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:rgba(201,162,39,.16);
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 520px at 50% -160px,rgba(22,48,92,.38),transparent 65%),
    radial-gradient(800px 500px at 88% 110%,rgba(201,162,39,.05),transparent 60%);
}
/* ---------- liquid background — gooey metaballs on canvas: a blurred field thresholded back to sharp liquid edges (see liquid engine script) ---------- */
.fluid-canvas{
  position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;
}
/* ---------- cursor follower — a gold ring + dot that complement the native cursor, never replace it ---------- */
.cursor-dot,.cursor-ring{position:fixed;top:0;left:0;z-index:200;border-radius:50%;pointer-events:none;display:none;opacity:0}
body.fx-cursor .cursor-dot,body.fx-cursor .cursor-ring{display:block}
body.cursor-live .cursor-dot,body.cursor-live .cursor-ring{opacity:1}
.cursor-dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--gold-2);transition:opacity .3s ease}
.cursor-ring{
  width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid rgba(201,162,39,.6);
  transition:opacity .3s ease,width .25s ease,height .25s ease,margin .25s ease,border-color .25s ease,background-color .25s ease;
}
.cursor-ring.grow{width:54px;height:54px;margin:-27px 0 0 -27px;border-color:rgba(230,199,102,.9);background:rgba(201,162,39,.07)}
.cursor-ring.press{width:25px;height:25px;margin:-12.5px 0 0 -12.5px;border-color:var(--gold-2)}
/* ---------- scroll reveal — JS adds .reveal only when motion is allowed.
   Transform-only on purpose: opacity is never taken to 0, so no card or link
   inside one can ever be invisible — the entrance is a smooth rise instead. ---------- */
.reveal{transform:translateY(16px)}
.reveal.in{transform:none;transition:transform .65s cubic-bezier(.2,.7,.25,1)}
::selection{background:var(--gold);color:#081226}
a{color:var(--gold-2);text-underline-offset:3px}
.skip-link{
  position:absolute;left:16px;top:-60px;z-index:100;background:var(--gold);color:#0a1428;
  font-weight:700;font-size:14px;padding:10px 16px;border-radius:0 0 8px 8px;text-decoration:none;
  transition:top .18s ease;
}
.skip-link:focus{top:0;color:#0a1428}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
.site-head{
  position:sticky;top:0;z-index:60;
  background:rgba(5,11,24,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.head-in{display:flex;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{
  width:40px;height:40px;border:1.5px solid var(--gold);border-radius:8px;
  display:grid;place-items:center;font-family:var(--serif);font-weight:800;
  font-size:21px;color:var(--gold);background:var(--navy-850);
}
.brand-name{font-family:var(--serif);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.1}
.brand-sub{font-size:10.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
.main-nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.main-nav a{
  color:var(--body);text-decoration:none;font-size:14.5px;font-weight:600;
  padding:8px 11px;border-radius:6px;letter-spacing:.01em;
  transition:transform .25s ease,color .2s ease,background .2s ease;
}
.main-nav a:hover{color:var(--gold-2);background:rgba(201,162,39,.08)}
.main-nav a[aria-current="page"]{color:#081226;background:var(--gold)}
.sound-btn{
  flex:none;margin-left:6px;background:transparent;border:1px solid var(--line);
  color:var(--muted);font-family:var(--sans);font-size:12px;font-weight:700;
  letter-spacing:.12em;padding:8px 12px;border-radius:6px;cursor:pointer;
  transition:transform .25s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.sound-btn:hover{color:var(--gold-2);border-color:var(--gold);box-shadow:0 0 14px rgba(201,162,39,.18)}
.sound-btn[aria-pressed="true"]{color:var(--gold-2);border-color:var(--gold)}
.nav-toggle{display:none;margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}

/* ---------- type ---------- */
.kicker{
  font-size:12px;font-weight:800;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);margin:0 0 14px;
}
.kicker::before{content:"";display:inline-block;width:26px;height:1px;background:var(--gold);vertical-align:middle;margin-right:10px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);margin:0;line-height:1.15;font-weight:700}
.display{font-size:clamp(42px,7.2vw,76px);font-weight:800;letter-spacing:.01em}
.display .gold{color:var(--gold)}
.page-title{font-size:clamp(32px,5vw,50px)}
.sec-title{font-size:clamp(26px,3.6vw,36px)}
/* soft gold shimmer drifting slowly across section headings — mostly solid ink, one faint glint */
@supports((-webkit-background-clip:text) or (background-clip:text)){
  .sec-title,.page-title{
    background-image:linear-gradient(100deg,var(--ink) 40%,#ecd28a 50%,var(--ink) 60%);
    background-size:260% 100%;background-position:125% 0;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    animation:shimmer 9s ease-in-out infinite;
  }
  @keyframes shimmer{0%{background-position:125% 0}42%,100%{background-position:0% 0}}
  html.bg-paused .sec-title,html.bg-paused .page-title{animation-play-state:paused}
}
.lede{font-size:clamp(17px,2vw,19.5px);color:var(--body);max-width:720px}
.small{font-size:14px;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);border:0;margin:0}

/* ---------- layout ---------- */
main{display:block}
#app:focus{outline:none}
.page{display:none}
.page.active{display:block;animation:pagein .55s cubic-bezier(.22,.8,.3,1) both}
@keyframes pagein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.section{padding:64px 0 8px}
.section:first-child{padding-top:44px}
.hero{padding:58px 0 10px;text-align:left;position:relative;isolation:isolate}
/* soft gold spotlight that follows the cursor across the hero */
.hero::before{
  content:"";position:absolute;inset:-30px -22px;z-index:-1;pointer-events:none;opacity:0;transition:opacity .45s ease;
  background:radial-gradient(430px circle at var(--spot-x,50%) var(--spot-y,38%),rgba(201,162,39,.11),rgba(201,162,39,.035) 45%,transparent 68%);
}
.hero.spot-on::before{opacity:1}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.focus-line{font-size:20px;color:var(--muted);margin:18px 0 0}
.focus-word{color:var(--gold-2);font-weight:700;font-family:var(--serif);font-size:23px;display:inline-block;min-width:190px}
.focus-word.swap{animation:swap .5s ease both}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{
  display:inline-block;text-decoration:none;font-weight:700;font-size:15px;
  padding:13px 22px;border-radius:7px;border:1px solid var(--gold);
  transition:transform .15s ease,background .15s ease,color .15s ease;
}
.btn-gold{background:var(--gold);color:#0a1428}
.btn-gold:hover{background:var(--gold-2);box-shadow:0 0 0 1px rgba(230,199,102,.35),0 10px 26px rgba(201,162,39,.28)}
.btn-ghost{background:transparent;color:var(--gold-2)}
.btn-ghost:hover{background:rgba(201,162,39,.1);box-shadow:0 0 18px rgba(201,162,39,.16)}
.btn:active{transform:translateY(1px)}

/* ---------- stats ---------- */
.stat-band{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-top:44px;
}
.stat{background:var(--navy-900);padding:20px 18px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:31px;color:var(--gold);line-height:1.1}
.stat span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
@media(max-width:640px){.stat-band{grid-template-columns:repeat(2,1fr)}}

/* ---------- cards ---------- */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:960px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-3,.grid-2{grid-template-columns:1fr}}
.card{
  background:linear-gradient(180deg,var(--card-2),var(--card));
  border:1px solid var(--line-soft);border-radius:12px;padding:24px;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.25),0 12px 26px rgba(0,0,0,.16);
  transition:border-color .2s ease,box-shadow .2s ease;
}
.card:hover{border-color:var(--line);box-shadow:0 18px 36px rgba(0,0,0,.34),0 0 22px rgba(201,162,39,.08)}
.card:active{border-color:var(--gold)}
/* shine sweep across cards on hover */
.card::after,.road-item::after,.next-card::after{
  content:"";position:absolute;top:0;left:-90%;width:55%;height:100%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(230,199,102,.09),transparent);
  transform:skewX(-18deg);transition:left .7s ease;
}
.card:hover::after,.road-item:hover::after,.next-card:hover::after{left:135%}
/* venture cards get the cursor tilt — a slower transform transition keeps it smooth */
.card.vcard{transition:transform .35s cubic-bezier(.2,.7,.3,1),border-color .2s ease,box-shadow .2s ease}
.card .num{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
.card h3{font-size:21px}
.card .tag{font-size:11.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;font-size:15.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:12.5px;border:1px solid var(--line-soft);border-radius:999px;padding:3px 10px;color:var(--body);background:rgba(148,170,210,.06)}
.card .visit{margin-top:auto;padding-top:12px;font-weight:700;font-size:14.5px;text-decoration:none;color:var(--gold-2)}
.card .visit:hover{text-decoration:underline}
.badge-warn{
  display:inline-block;font-size:12px;font-weight:700;color:#f3d27a;
  border:1px solid rgba(201,162,39,.55);background:rgba(201,162,39,.1);
  border-radius:6px;padding:4px 9px;
}
.price{font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:700}
.price.free{color:#9fd6a4}

/* ---------- marquee ---------- */
.marquee-band{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin-top:52px;overflow:hidden;padding:13px 0}
.marquee{display:flex;gap:44px;width:max-content;animation:scrollx 36s linear infinite;font-family:var(--serif);font-size:16px;letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.marquee span::after{content:"·";margin-left:44px;color:var(--gold)}
.marquee-band:hover .marquee{animation-play-state:paused}
@keyframes scrollx{to{transform:translateX(-50%)}}

/* ---------- 3D stages (CSS only, restrained) ---------- */
.stage{
  border:1px solid var(--line);border-radius:14px;background:
    radial-gradient(600px 260px at 50% 0%,rgba(22,48,92,.5),transparent 70%),
    linear-gradient(180deg,var(--navy-850),var(--navy-900));
  padding:30px 20px 22px;text-align:center;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(230,199,102,.05),0 18px 36px rgba(0,0,0,.2);
}
.stage-label{font-size:11.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.stage-title{font-family:var(--serif);font-size:21px;color:var(--ink);margin:0 0 18px}
.orbit-scene{position:relative;height:250px}
.orbit-world{position:absolute;left:50%;top:50%;width:0;height:0}
.orbit-core{
  position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#2a4a80,#0e1d3a 68%);
  border:1px solid var(--line);display:grid;place-items:center;
  font-family:var(--serif);font-weight:800;font-size:24px;color:var(--gold);
}
.orb{
  position:absolute;left:50%;top:50%;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold-deep));
  border:0;padding:0;transform:translate(-50%,-50%);
  box-shadow:0 0 0 3px rgba(201,162,39,.15);
}
button.orb{cursor:pointer}
.orb[aria-pressed="true"]{box-shadow:0 0 0 5px rgba(201,162,39,.4)}
.orb:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.stage-panel{max-width:560px;margin:16px auto 0;min-height:86px}
.stage-panel h3{font-size:20px;margin-bottom:4px}
.stage-panel p{margin:0;font-size:15px}
.stage-controls{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ctrl{
  background:transparent;border:1px solid var(--line);color:var(--body);
  font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;
  padding:8px 16px;border-radius:999px;cursor:pointer;
  transition:transform .25s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.ctrl:hover{border-color:var(--gold);color:var(--gold-2);box-shadow:0 0 14px rgba(201,162,39,.16)}
.ctrl:active{background:rgba(201,162,39,.14)}
.ctrl[aria-pressed="true"]{background:var(--gold);color:#0a1428;border-color:var(--gold)}
.stage-hint{font-size:13.5px;color:var(--muted);max-width:540px;margin:-6px auto 2px}
.orbit-scene.orbit-tall{height:330px}
.orbit-scene.orbit-mid{height:300px}
#homeRing .orb-label{bottom:26px}
#homeRing .orb-label.below{bottom:auto;top:26px}
/* labeled venture markers */
button.orb-v{
  width:38px;height:38px;background:none;box-shadow:none;
  display:grid;place-items:center;
}
.orb-dot{
  display:block;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold-deep));
  box-shadow:0 0 0 3px rgba(201,162,39,.15);
  transition:box-shadow .2s ease;
}
.orb-v:hover .orb-dot{box-shadow:0 0 0 4px rgba(201,162,39,.3),0 0 16px rgba(201,162,39,.5)}
.orb-v:active .orb-dot{box-shadow:0 0 0 6px rgba(201,162,39,.45)}
.orb-v[aria-pressed="true"] .orb-dot{box-shadow:0 0 0 5px rgba(201,162,39,.45)}
.orb-label{
  position:absolute;left:50%;bottom:31px;transform:translateX(-50%) translateY(calc(-1 * var(--tier,0px)));
  font-size:11px;font-weight:700;letter-spacing:.02em;line-height:1.25;white-space:nowrap;
  color:var(--ink);background:rgba(6,13,28,.88);border:1px solid var(--line-soft);
  padding:2px 8px;border-radius:999px;pointer-events:none;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.orb-label.below{bottom:auto;top:31px;transform:translateX(-50%) translateY(var(--tier,0px))}
.orb-v:hover .orb-label,.orb-v:focus-visible .orb-label{border-color:var(--gold);color:var(--gold-2)}
.orb-v[aria-pressed="true"] .orb-label{background:var(--gold);color:#0a1428;border-color:var(--gold)}
@media(max-width:640px){
  .orb-label{font-size:9.5px;padding:1px 6px;letter-spacing:0}
}

/* HQ diorama — glass office interior, CSS 3D */
.hq-scene{height:312px;perspective:1000px;display:grid;place-items:center}
.hq-world{position:relative;width:300px;height:190px;transform-style:preserve-3d;transition:transform .8s ease}
.hq-floor{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 210px 115px at 50% 55%,rgba(230,180,90,.11),transparent 70%),
    linear-gradient(90deg,rgba(201,162,39,.12) 1px,transparent 1px) 0 0/50px 100%,
    linear-gradient(rgba(201,162,39,.08) 1px,transparent 1px) 0 0/100% 47px,
    linear-gradient(135deg,rgba(38,72,128,.92),rgba(14,29,58,.97));
  border:1px solid var(--line);border-radius:6px;
}
.hq-rug{
  position:absolute;left:28px;top:28px;width:244px;height:136px;transform:translateZ(1px);
  border:1px solid rgba(201,162,39,.30);background:rgba(201,162,39,.05);border-radius:5px;
}
.hq-wall{
  position:absolute;border:1px solid rgba(201,162,39,.5);
  background:
    linear-gradient(115deg,rgba(190,220,255,0) 42%,rgba(190,220,255,.09) 50%,rgba(190,220,255,0) 58%),
    repeating-linear-gradient(90deg,rgba(160,195,240,.10) 0 46px,rgba(201,162,39,.30) 46px,rgba(201,162,39,.30) 47px),
    repeating-linear-gradient(0deg,rgba(160,195,240,.10) 0 52px,rgba(201,162,39,.30) 52px,rgba(201,162,39,.30) 53px),
    linear-gradient(180deg,rgba(120,165,225,.15),rgba(120,165,225,.05));
}
.hq-wall.back{left:0;top:-108px;width:100%;height:108px;transform-origin:50% 100%;transform:rotateX(-90deg);border-radius:4px 4px 0 0}
.hq-wall.left{left:-108px;top:0;width:108px;height:100%;transform-origin:100% 50%;transform:rotateY(90deg)}
.hq-wall.right{left:100%;top:0;width:108px;height:100%;transform-origin:0 50%;transform:rotateY(-90deg)}
.hq-plaque{
  position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);
  width:46px;height:46px;display:grid;place-items:center;border:1.5px solid var(--gold);border-radius:7px;
  background:rgba(8,18,38,.72);font-family:var(--serif);font-weight:800;font-size:24px;color:var(--gold);
}
.hq-frame{
  position:absolute;top:26%;width:52px;height:34px;border:1px solid rgba(201,162,39,.55);border-radius:3px;
  background:
    linear-gradient(0deg,rgba(201,162,39,.8) 0 45%,rgba(201,162,39,0) 45%) 7px 100%/7px 62% no-repeat,
    linear-gradient(0deg,rgba(126,163,216,.85) 0 30%,rgba(126,163,216,0) 30%) 19px 100%/7px 62% no-repeat,
    linear-gradient(0deg,rgba(230,199,102,.85) 0 66%,rgba(230,199,102,0) 66%) 31px 100%/7px 62% no-repeat,
    rgba(8,18,38,.66);
}
.hq-shadow{
  position:absolute;width:64px;height:36px;transform:translateZ(1px);border-radius:6px;
  background:rgba(0,0,0,.42);filter:blur(3px);
}
.hq-slab{position:absolute;width:64px;height:36px;border-radius:4px}
.hq-slab.low{transform:translateZ(9px);background:linear-gradient(180deg,#3a2413,#291a0d);border:1px solid rgba(0,0,0,.55)}
.hq-slab.top{
  transform:translateZ(17px);border:1px solid rgba(230,199,102,.38);
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 2px,rgba(0,0,0,0) 2px 9px),
    linear-gradient(180deg,#8a5a30,#6e4525 60%,#5d3a1f);
}
.hq-stand{position:absolute;width:10px;height:5px;transform:translateZ(18px);background:#0a1220;border-radius:1px}
.hq-monitor{
  position:absolute;width:28px;height:17px;border-radius:2px;border:1px solid rgba(4,8,16,.92);
  transform-origin:50% 100%;transform:translateZ(18px) rotateX(-90deg);
  box-shadow:0 0 10px rgba(110,150,210,.35);
}
.hq-monitor.scr-lines{
  background:
    linear-gradient(180deg,rgba(230,199,102,.9) 0 3px,rgba(13,31,60,0) 3px),
    repeating-linear-gradient(180deg,rgba(178,205,240,.8) 0 2px,rgba(178,205,240,0) 2px 5px),
    linear-gradient(180deg,#12294d,#0a1730);
  background-size:100% 100%,72% 55%,100% 100%;
  background-position:0 0,4px 7px,0 0;
  background-repeat:no-repeat;
}
.hq-monitor.scr-chart{
  background:
    linear-gradient(0deg,rgba(201,162,39,.85) 0 55%,rgba(201,162,39,0) 55%),
    linear-gradient(0deg,rgba(126,163,216,.85) 0 36%,rgba(126,163,216,0) 36%),
    linear-gradient(0deg,rgba(230,199,102,.85) 0 74%,rgba(230,199,102,0) 74%),
    linear-gradient(180deg,#12294d,#0a1730);
  background-size:5px 68%,5px 68%,5px 68%,100% 100%;
  background-position:5px 100%,12px 100%,19px 100%,0 0;
  background-repeat:no-repeat;
}
.hq-monitor.scr-code{
  background:
    repeating-linear-gradient(180deg,rgba(159,214,164,.75) 0 2px,rgba(159,214,164,0) 2px 5px),
    repeating-linear-gradient(180deg,rgba(178,205,240,.55) 0 2px,rgba(178,205,240,0) 2px 6px),
    linear-gradient(180deg,#0e2138,#081426);
  background-size:58% 62%,78% 62%,100% 100%;
  background-position:3px 4px,6px 5px,0 0;
  background-repeat:no-repeat;
}
.hq-kbd{position:absolute;width:20px;height:7px;transform:translateZ(18px);border-radius:1px;background:linear-gradient(180deg,#22314f,#131f38);border:1px solid rgba(148,170,210,.3)}
.hq-lamp{
  position:absolute;width:10px;height:10px;border-radius:50%;transform:translateZ(18px);
  background:radial-gradient(circle at 40% 35%,#ffedb5,#d9a83f 65%,rgba(217,168,63,0));
  box-shadow:0 0 10px 3px rgba(240,200,100,.4);
}
.hq-chair-seat{
  position:absolute;width:20px;height:18px;transform:translateZ(10px);border-radius:4px;
  background:linear-gradient(180deg,#1d2c49,#111c33);border:1px solid rgba(201,162,39,.42);
}
.hq-chair-back{
  position:absolute;width:20px;height:15px;transform-origin:50% 0;transform:translateZ(10px) rotateX(90deg);
  border-radius:3px;background:linear-gradient(180deg,#24365a,#141f3a);border:1px solid rgba(201,162,39,.42);
}
.hq-plant{position:absolute;width:16px;height:16px;transform-style:preserve-3d}
.hq-plant .pot{
  position:absolute;inset:2px;border-radius:50%;transform:translateZ(4px);
  background:radial-gradient(circle at 40% 35%,#8a5a30,#4a2d15);
}
.hq-plant .leaf{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 32%,#8fbc7e,#3d6b3a 72%)}
.hq-plant .leaf.l1{width:22px;height:22px;left:-3px;top:-3px;transform:translateZ(12px)}
.hq-plant .leaf.l2{width:16px;height:16px;left:4px;top:-6px;transform:translateZ(19px);background:radial-gradient(circle at 38% 32%,#a5cc90,#46743f 72%)}
.hq-pool{
  position:absolute;width:110px;height:60px;margin:-30px 0 0 -55px;border-radius:50%;
  transform:translateZ(2px);background:radial-gradient(ellipse at center,rgba(240,190,90,.16),rgba(240,190,90,0) 70%);
}
.hq-pendant{
  position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  transform:translateZ(86px);
  background:radial-gradient(circle at 40% 35%,#ffe9a8,#c9a227 60%,#8f7214);
  box-shadow:0 0 18px 6px rgba(230,190,90,.35);
}
.hq-caption{font-size:13.5px;color:var(--muted);max-width:620px;margin:14px auto 0}

/* ---------- founder ---------- */
.founder-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:40px;align-items:start}
@media(max-width:860px){.founder-grid{grid-template-columns:1fr}}
.portrait-frame{
  border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--navy-900);
  max-width:430px;box-shadow:0 18px 38px rgba(0,0,0,.32);
}
.portrait-tilt{border-radius:9px;overflow:hidden;transform-style:preserve-3d;will-change:transform}
.portrait-tilt img{display:block;width:100%;height:auto}
.portrait-cap{text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:12px}
.fact-list{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line-soft)}
.fact-list li{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line-soft);font-size:15px}
.fact-list li span{color:var(--muted)}
.fact-list li b{color:var(--ink);font-weight:700;text-align:right}
.note-box{border:1px solid var(--line);border-radius:12px;padding:20px 22px;background:rgba(201,162,39,.05);margin-top:26px}
.note-box h3{font-size:18px;margin-bottom:6px}
.note-box p{margin:0;font-size:15px}

/* ---------- FAQ ---------- */
.faq-list{display:grid;gap:14px;margin-top:22px;max-width:860px}
.faq-item{border:1px solid var(--line-soft);border-radius:12px;background:linear-gradient(180deg,var(--card-2),var(--card));overflow:hidden;transition:border-color .25s ease,box-shadow .25s ease}
.faq-item:hover{border-color:rgba(201,162,39,.45)}
.faq-item.open{border-color:var(--gold);box-shadow:0 10px 26px rgba(0,0,0,.22),0 0 16px rgba(201,162,39,.1)}
.faq-q{margin:0;font-size:18px}
.faq-btn{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 22px;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--sans);font-size:17.5px;font-weight:700;line-height:1.35;color:var(--ink);transition:color .2s ease,background .2s ease}
.faq-btn:hover{color:var(--gold-2);background:rgba(201,162,39,.05)}
.faq-btn:active{background:rgba(201,162,39,.11)}
.faq-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;color:var(--gold-2)}
.faq-item.open .faq-btn{color:var(--gold-2)}
.faq-icon{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);position:relative;transition:transform .35s ease,background .25s ease,border-color .25s ease}
.faq-icon::before,.faq-icon::after{content:"";position:absolute;top:50%;left:50%;background:var(--gold-2);border-radius:2px}
.faq-icon::before{width:12px;height:2px;transform:translate(-50%,-50%)}
.faq-icon::after{width:2px;height:12px;transform:translate(-50%,-50%)}
.faq-btn:hover .faq-icon{border-color:var(--gold)}
.faq-item.open .faq-icon{background:var(--gold);border-color:var(--gold);transform:rotate(135deg)}
.faq-item.open .faq-icon::before,.faq-item.open .faq-icon::after{background:#0a1428}
.faq-panel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .38s ease,visibility 0s linear .38s}
.faq-panel.open{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .38s ease,visibility 0s}
.faq-panel-in{overflow:hidden;min-height:0}
.faq-panel p{margin:0;padding:0 22px 20px;font-size:15.5px}
.faq-panel a{color:var(--gold-2)}

/* ---------- roadmap ---------- */
.phase-chip{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.16em;padding:4px 10px;border-radius:5px;border:1px solid var(--line-soft);color:var(--muted)}
.phase-chip.DONE{background:var(--gold);color:#0a1428;border-color:var(--gold)}
.phase-chip.NOW{border-color:var(--gold);color:var(--gold-2)}
.road-item{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line-soft);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.15)}
.road-item h3{font-size:18.5px;margin-top:10px;font-family:var(--sans);font-weight:700}
.road-item p{margin:4px 0 0;font-size:15px}
.phase-group-head{margin:34px 0 4px;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.phase-group-head span{color:var(--muted);letter-spacing:.02em;text-transform:none;font-weight:500;margin-left:8px}

/* ---------- services proof ---------- */
.proof-row{display:grid;grid-template-columns:230px 1fr;gap:8px 26px;padding:22px 0;border-bottom:1px solid var(--line-soft)}
.proof-row:first-of-type{border-top:1px solid var(--line-soft)}
.proof-row h3{font-size:19px}
.proof-row p{margin:0;font-size:15.5px}
@media(max-width:700px){.proof-row{grid-template-columns:1fr}}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:start}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line-soft);border-radius:12px;padding:26px;box-shadow:0 14px 30px rgba(0,0,0,.2)}
.panel h2,.panel h3{font-size:22px;margin-bottom:8px}
.field{margin-top:16px}
.field label{display:block;font-size:13.5px;font-weight:700;letter-spacing:.05em;color:var(--ink);margin-bottom:6px}
.field input,.field textarea{
  width:100%;background:var(--navy-900);border:1px solid var(--line-soft);border-radius:8px;
  color:var(--ink);font-family:var(--sans);font-size:15.5px;padding:11px 13px;
}
.field input:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.field .err{color:#f0a3a3;font-size:13.5px;margin-top:5px}
.form-note{font-size:13.5px;color:var(--muted);margin-top:14px}
.form-done{border:1px solid var(--line);background:rgba(201,162,39,.07);border-radius:8px;padding:13px 15px;font-size:14.5px;margin-top:16px;color:var(--ink)}
.reach-list{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:9px}
.reach-list a{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border:1px solid var(--line-soft);border-radius:9px;padding:13px 16px;
  color:var(--ink);text-decoration:none;font-weight:600;font-size:15.5px;background:var(--navy-900);
}
.reach-list a:hover{border-color:var(--gold);box-shadow:0 0 16px rgba(201,162,39,.12)}
.reach-list a:active{border-color:var(--gold);background:var(--navy-850)}
.reach-list a .arr{color:var(--gold)}

/* ---------- next pages / footer ---------- */
.next-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
@media(max-width:760px){.next-grid{grid-template-columns:1fr}}
.next-card{border:1px solid var(--line-soft);border-radius:10px;padding:18px 20px;text-decoration:none;background:var(--navy-900);display:block;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.14);transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
.next-card:hover{border-color:var(--gold);box-shadow:0 12px 24px rgba(0,0,0,.26),0 0 16px rgba(201,162,39,.1)}
.next-card:active{border-color:var(--gold);background:var(--navy-850)}
.next-card b{font-family:var(--serif);font-size:18px;color:var(--ink);display:block}
.next-card span{font-size:14px;color:var(--muted)}
.site-foot{border-top:1px solid var(--line);margin-top:76px;padding:34px 0 42px;background:rgba(5,11,24,.6)}
.foot-nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:16px}
.foot-nav a{color:var(--body);text-decoration:none;font-size:14px;font-weight:600}
.foot-nav a:hover{color:var(--gold-2)}
.foot-note{font-size:13.5px;color:var(--muted);max-width:760px}

/* ---------- back to top — appears once the reader is well down the page ---------- */
.to-top{
  position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;
  width:46px;height:46px;padding:0;border-radius:10px;cursor:pointer;
  display:grid;place-items:center;
  background:var(--navy-850);border:1.5px solid var(--gold);color:var(--gold-2);
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  opacity:.5;
  transition:opacity .25s ease,background-color .2s ease,border-color .2s ease;
}
.to-top.show{opacity:1}
.to-top:hover{background:var(--navy-700);border-color:var(--gold-2)}
.to-top:active{transform:translateY(2px)}
.to-top svg{width:20px;height:20px;display:block}

@media(max-width:860px){
  .main-nav{display:none;width:100%;order:5;flex-direction:column;padding:8px 0 4px}
  .main-nav.open{display:flex}
  .main-nav a{padding:11px 10px}
  .nav-toggle{display:block}
  .head-in{flex-wrap:wrap}
  .sound-btn{margin-left:auto}
  .nav-toggle{margin-left:0}
}
@media(prefers-reduced-motion:reduce){
  .marquee{animation:none}
  .page.active{animation:none}
  .faq-panel,.faq-icon,.faq-btn,.faq-item{transition:none}
  html{scroll-behavior:auto}
  .hq-world{transition:none}
  .card,.skip-link,.to-top{transition:none}
  .cursor-dot,.cursor-ring{display:none !important}
  .reveal{transform:none}
  .card::after,.road-item::after,.next-card::after{display:none}
  .sec-title,.page-title{animation:none;background:none;color:var(--ink);-webkit-text-fill-color:currentColor}
}
@page{margin:11mm}
@media print{
  body{background:#fff;color:#1a2436}
  body::before{display:none}
  .fluid-canvas,.cursor-dot,.cursor-ring,.to-top{display:none}
  .reveal{transform:none}
  .sec-title,.page-title{background:none;-webkit-text-fill-color:#0a1730}
  .site-head,.site-foot .foot-nav,.sound-btn,.nav-toggle,.stage,.cta-row,.marquee-band{display:none}
  .site-foot{border-top:1px solid #ccc;background:none}
  h1,h2,h3,.stat b,.price{color:#0a1730}
  .card,.panel,.road-item,.portrait-frame{background:#fff;border-color:#bbb;box-shadow:none}
  .faq-panel{grid-template-rows:1fr !important;visibility:visible !important}
  .faq-icon{display:none}
  .page{display:block !important}
}

function initStatCountUp(){
  var els=document.querySelectorAll(".stat b[data-count]");
  if(!els.length)return;
  var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function finalText(el){
    return el.getAttribute("data-prefix")+Number(el.getAttribute("data-count")).toFixed(Number(el.getAttribute("data-decimals")))+el.getAttribute("data-suffix");
  }
  function animate(el){
    if(reduced){el.textContent=finalText(el);return;}
    var target=Number(el.getAttribute("data-count")),dec=Number(el.getAttribute("data-decimals"));
    var pre=el.getAttribute("data-prefix"),suf=el.getAttribute("data-suffix");
    var start=0,dur=1100;
    function tick(t){
      if(!start)start=t;
      var p=Math.min((t-start)/dur,1),e=1-Math.pow(1-p,3);
      el.textContent=pre+(target*e).toFixed(dec)+suf;
      if(p<1)requestAnimationFrame(tick);else el.textContent=finalText(el);
    }
    requestAnimationFrame(tick);
  }
  if(!("IntersectionObserver" in window)){Array.prototype.forEach.call(els,animate);return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){animate(en.target);io.unobserve(en.target);}});
  },{threshold:.4});
  Array.prototype.forEach.call(els,function(el){io.observe(el);});
}

/* ================= SERVICES ================= */
function servicesPage(){
  return pageHead("Category · Services","What we build — with proof",
    "Every service links back to a live project. No vapourware, no mock clients.")
  +'<section class="section" style="padding-top:30px">'
  +'<div class="grid-2">'
  + SERVICES.map(function(s){
      return '<article class="card"><span style="font-size:26px;color:var(--gold)" aria-hidden="true">'+s.ic+'</span><h3 style="font-size:20px">'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></article>';
    }).join("")
  +'</div></section>'
  +'<section class="section">'
  + sectionHead("Service Details · With Proof","Each service, and where to see it working")
  +'<div style="margin-top:10px">'
  + PROOF.map(function(p){
      return '<div class="proof-row"><h3>'+esc(p.s)+'</h3><div><p>'+esc(p.d)+'</p><p style="margin-top:10px"><a href="'+p.u+'" target="_blank" rel="noopener" style="font-weight:700">See it live →</a></p></div></div>';
    }).join("")
  +'</div></section>'
  + nextPages([["/contact","Contact","Ask about a service through the ventures."],["/products","Products","The product shelf."],["/roadmap","Roadmap","Where the services are heading."]]);
}

/* ================= ROADMAP ================= */
function roadmapPage(){
  var phases=["DONE","NOW","NEXT","LATER","DREAM"];
  var detail = phases.map(function(ph){
    var items=ROADMAP.filter(function(m){return m.phase===ph;});
    if(!items.length)return "";
    return '<h3 class="phase-group-head">'+ph+'<span>— '+esc(PHASE_NOTES[ph])+'</span></h3>'
      +'<div class="grid-2" style="margin-top:12px">'
      + items.map(function(m){return '<article class="road-item"><h3 style="margin-top:0">'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p></article>';}).join("")
      +'</div>';
  }).join("");
  return pageHead("Category · Roadmap & Future Plans","What comes next, in order",
    "Plans, not promises. DONE is done; everything else is being worked toward.")
  +'<section class="section" style="padding-top:30px">'
  +'<div class="grid-2">'
  + ROADMAP.map(function(m){
      return '<article class="road-item"><span class="phase-chip '+m.phase+'">'+m.phase+'</span><h3>'+esc(m.t)+'</h3><p>'+esc(m.d)+'</p></article>';
    }).join("")
  +'</div></section>'
  +'<section class="section">'
  + sectionHead("Future Plans in Detail","The plan, phase by phase")
  + detail
  +'</section>'
  + nextPages([["/ventures","Ventures","All nine ventures, live and linked."],["/founder","Founder","Meet the founder."],["/contact","Contact","Reach us through the ventures."]]);
}

  +'<section class="section" style="padding-top:30px"><div class="founder-grid">'

/* ================= AUDIO — synthesized, off by default ================= */
var SoundFX={
  ctx:null,on:false,
  tone:function(f,dur){
    if(!this.on||!this.ctx)return;
    var t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.04,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(t+dur+0.02);
  },
  click:function(){this.tone(660,0.08);},
  nav:function(){this.tone(520,0.1);},
  toggle:function(){

   A soft field is drawn additively on a small offscreen canvas, then every
   pixel is thresholded back to a hard alpha edge: shapes merge, stretch and
   split like liquid instead of reading as blur. Specular rim light is derived
   from the field gradient, gold cores tint the liquid from inside, and a

    {ax:.90,ay:.06,ox:.040,oy:.050,sp:.19,ph:4.0,rf:.24,gold:0},
    {ax:.05,ay:.05,ox:.040,oy:.045,sp:.15,ph:1.2,rf:.21,gold:0},
    {ax:.30,ay:.28,ox:.150,oy:.110,sp:.11,ph:3.3,rf:.135,gold:0},
    {ax:.71,ay:.55,ox:.130,oy:.130,sp:.12,ph:5.1,rf:.120,gold:0},
    {ax:.48,ay:.88,ox:.190,oy:.050,sp:.09,ph:0.7,rf:.105,gold:0},
    {ax:.15,ay:.52,ox:.050,oy:.150,sp:.14,ph:2.8,rf:.085,gold:1},

/* ================= CURSOR & MOTION FX =================
   Gold cursor follower (the native cursor always stays), magnetic pull on
   buttons, tilt on venture cards, a spotlight that follows the cursor across
   the hero, and staggered scroll reveals. Everything here is fine-pointer
   only and fully off under prefers-reduced-motion; touch devices keep the
   CSS tap feedback and nothing else. */
var FINE_POINTER=window.matchMedia("(hover: hover) and (pointer: fine)").matches;
var REDUCED_MOTION=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var revealIO=null;
function magnetize(el,strength,max){
  var rect=null;
  el.addEventListener("pointerenter",function(){rect=el.getBoundingClientRect();});
  el.addEventListener("pointermove",function(ev){
    if(!rect)rect=el.getBoundingClientRect();
    var dx=(ev.clientX-(rect.left+rect.width/2))*strength;
    var dy=(ev.clientY-(rect.top+rect.height/2))*strength;
    var len=Math.sqrt(dx*dx+dy*dy);
    if(len>max){dx=dx/len*max;dy=dy/len*max;}
    el.style.transform="translate("+dx.toFixed(1)+"px,"+dy.toFixed(1)+"px)";
  });
  el.addEventListener("pointerleave",function(){rect=null;el.style.transform="";});
}
function tiltCard(el){
  var raf=0,lx=0,ly=0;
  el.addEventListener("pointermove",function(ev){
    var r=el.getBoundingClientRect();
    lx=(ev.clientX-r.left)/Math.max(r.width,1)-0.5;
    ly=(ev.clientY-r.top)/Math.max(r.height,1)-0.5;
    if(raf)return;
    raf=requestAnimationFrame(function(){
      raf=0;
      el.style.transform="perspective(850px) rotateY("+(lx*5).toFixed(2)+"deg) rotateX("+(-ly*5).toFixed(2)+"deg) translate("+(lx*5).toFixed(1)+"px,"+(ly*5).toFixed(1)+"px)";
    });
  });
  el.addEventListener("pointerleave",function(){
    if(raf)cancelAnimationFrame(raf);raf=0;el.style.transform="";
  });
}
function initReveal(){
  if(revealIO){revealIO.disconnect();revealIO=null;}
  var els=document.querySelectorAll("#app .card, #app .road-item, #app .stat-band, #app .stage, #app .panel, #app .note-box, #app .proof-row, #app .next-card, #app .portrait-frame, #app .phase-group-head, #app .sec-title, #app .page-title, #app .marquee-band, #app .hero-grid > div, #app .fact-list");
  if(!els.length||REDUCED_MOTION||!("IntersectionObserver" in window))return;
  var parents=[],counts=[];

    if(!el.classList.contains("reveal")||el.classList.contains("in"))return;
    if(instant)el.style.transitionDelay="0ms";
    el.classList.add("in");
    var wait=(instant?0:Number(el.getAttribute("data-rdelay")||0))+850;
    setTimeout(function(){
      el.classList.remove("reveal","in");

     after activation is settled outright, delays cleared, so no card is
     left mid-rise */

      var x=(ev.clientX-r.left)/Math.max(r.width,1)-0.5;
      var y=(ev.clientY-r.top)/Math.max(r.height,1)-0.5;
      tilt.style.transform="perspective(900px) rotateY("+(x*7).toFixed(2)+"deg) rotateX("+(-y*7).toFixed(2)+"deg)";
    });
    frame.addEventListener("pointerleave",function(){tilt.style.transform="";});
  }
  /* contact form — validation only, mirrors the live site */
  var form=document.getElementById("contactForm");
  if(form){
    form.addEventListener("submit",function(ev){
      ev.preventDefault();
      var name=document.getElementById("cf-name").value.trim();
      var email=document.getElementById("cf-email").value.trim();
      var msg=document.getElementById("cf-msg").value.trim();
      var okName=name.length>0;
      var okEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      var okMsg=msg.length>=10;
      document.getElementById("err-name").hidden=okName;
      document.getElementById("err-email").hidden=okEmail;
      document.getElementById("err-msg").hidden=okMsg;
      var done=document.getElementById("formDone");
      if(okName&&okEmail&&okMsg){done.hidden=false;SoundFX.nav();done.scrollIntoView({block:"nearest",behavior:"smooth"});}
      else{done.hidden=true;}
    });
  }
}
var firstRender=true;
function render(){
  stopFocusCycle();
  stopOrbits();
  var route=currentRoute();
  document.title=TITLES[route];
  var pageUrl="https://syedsenterprises.org/"+(route==="/"? "" : "#"+route);
  setMeta('link[rel="canonical"]',"href",pageUrl);
  setMeta('meta[name="description"]',"content",DESCRIPTIONS[route]);
  setMeta('meta[property="og:title"]',"content",TITLES[route]);
  setMeta('meta[property="og:url"]',"content",pageUrl);
  setMeta('meta[property="og:description"]',"content",DESCRIPTIONS[route]);
  setMeta('meta[name="twitter:title"]',"content",TITLES[route]);
  setMeta('meta[name="twitter:description"]',"content",DESCRIPTIONS[route]);
  var app=document.getElementById("app");
  app.innerHTML='<div class="page active">'+ROUTES[route]()+'</div>';
  buildNav();
  document.getElementById("mainNav").classList.remove("open");
  document.getElementById("navToggle").setAttribute("aria-expanded","false");
  wirePage(route);
  window.scrollTo(0,0);
  if(!firstRender)app.focus({preventScroll:true});
  firstRender=false;
}
document.addEventListener("visibilitychange",function(){
  document.documentElement.classList.toggle("bg-paused",document.hidden);
});
document.getElementById("skipLink").addEventListener("click",function(ev){
  ev.preventDefault();
  document.getElementById("app").focus();
});
document.getElementById("soundBtn").addEventListener("click",function(){
  var on=SoundFX.toggle();
  this.setAttribute("aria-pressed",on?"true":"false");
  this.setAttribute("aria-label",on?"Turn sound off":"Turn sound on");
  this.textContent=on?"SOUND ON":"SOUND OFF";
});
document.getElementById("navToggle").addEventListener("click",function(){
  var nav=document.getElementById("mainNav");
  var open=nav.classList.toggle("open");
  this.setAttribute("aria-expanded",open?"true":"false");
});
document.getElementById("mainNav").addEventListener("click",function(ev){
  if(ev.target.tagName==="A")SoundFX.nav();
});
var toTopBtn=document.getElementById("toTop");
function syncToTop(){
  toTopBtn.classList.toggle("show",window.scrollY>480);
}
window.addEventListener("scroll",syncToTop,{passive:true});
toTopBtn.addEventListener("click",function(){
  var reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
});
syncToTop();
window.addEventListener("hashchange",render);
render();
initCursor();
</script>
</body>
</html>
